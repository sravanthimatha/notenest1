<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload – NoteNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="layout"><div id="sidebarMount"></div><main class="main"><div class="page-head"><div><button class="btn btn-light btn-sm hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button><h1>Upload Study Material</h1><p class="muted">PDF only, max 10 MB. Help your classmates learn faster.</p></div></div>
<div class="upload-box"><div class="alert" id="alertBox"></div><form id="uploadForm">
<div class="form-group"><label>Title *</label><input id="title" required placeholder="e.g. Data Structures Unit 1 Notes"></div>
<div class="form-group"><label>Description *</label><textarea id="description" rows="3" required placeholder="What does this material cover?"></textarea></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Subject *</label><input id="subject" required placeholder="e.g. Data Structures" list="subjectList"><datalist id="subjectList"></datalist></div><div class="form-group"><label>Semester *</label><select id="semester"></select></div></div>
<div class="form-group"><label>Material Type *</label><select id="type"><option>Notes</option><option>Question Paper</option><option>Assignment</option><option>Lab Record</option><option>Reference Material</option></select></div>
<div class="form-group"><label>Study File (PDF / PPT / DOC) *</label><div class="drop" onclick="document.getElementById('file').click()"><div style="font-size:34px">📄</div><b>Click to choose a file</b><div class="muted small" id="fileName">No file selected</div></div><input type="file" id="file" accept=".pdf,.doc,.docx,.ppt,.pptx" required style="display:none"></div>
<button class="btn" style="width:100%;justify-content:center" id="uploadBtn">Upload Material</button></form></div>
<h2 class="section-title">My Uploads</h2><div class="grid" id="myGrid"></div><div id="myEmpty"></div>
</main></div><div id="modalMount"></div><script src="js/api.js"></script><script src="js/upload.js"></script></body></html>
