<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register – NoteNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="auth-wrap"><div class="auth-card"><a class="logo" href="index.html"><span class="mark">🎓</span>Note<span>Nest</span></a><h1>Create account</h1><p class="muted">Join NoteNest and start sharing knowledge.</p><div style="height:16px"></div><div class="alert" id="alertBox"></div>
<form id="registerForm"><div class="form-group"><label>Full Name *</label><input id="name" required placeholder="Your name"></div><div class="form-group"><label>Email *</label><input type="email" id="email" required placeholder="you@college.edu"></div><div class="form-group"><label>Password * (min 6 characters)</label><input type="password" id="password" required minlength="6" placeholder="Create a password"></div><div class="form-group"><label>College</label><input id="college" placeholder="Your college name"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="form-group"><label>Branch</label><select id="branch"><option value="">Select</option><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>IT</option><option>AI & DS</option><option>Other</option></select></div><div class="form-group"><label>Semester</label><select id="semester"></select></div></div><button class="btn" style="width:100%;justify-content:center" id="registerBtn">Register</button></form>
<p style="margin-top:14px;text-align:center" class="small">Already have an account? <a href="login.html" style="color:var(--green);font-weight:700">Login</a></p></div></div>
<div class="toast" id="toast"></div><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
